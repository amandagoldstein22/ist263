    My name is Amanda Goldstein and I'm a third year Strategic Advertising major at Syracuse University's Newhouse School. I also have minors in Marketing at Whitman and Information Management and Technology at the iSchool. This past summer I interned in Ad Sales at FOX and it was a life changing experience. It confirmed that ad sales is the career I want to go into. What interests me most is how brands reach their audiences, and the work behind brand partnerships and campaigns with talent. I have a real passion for sports, entertainment, and lifestyle marketing. I'm also very interested in AI and how it's changing the advertising industry. I've been learning how to use AI tools in my own work, and I'm always looking for new ways they can help me do it better. I'm bilingual, and I played Division I soccer. I was also captain of Panama's U20 Women's National Team, which taught me a lot about leadership and working with people from different backgrounds. I bring that same competitive mindset to everything I do. Outside of school I'm really into health and wellness. I do Pilates and hot yoga as much as I can. I love TV and movies, and I'm very close with my family.
