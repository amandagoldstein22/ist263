<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact | Amanda Goldstein</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to main content</a>
<header>
  <nav aria-label="Main navigation">
    <a href="index.html">Home</a> <span>|</span>
    <a href="skills.html">Skills</a> <span>|</span>
    <a href="contact.html">Contact</a>
  </nav>
</header>

<main id="main">
  <h1>Contact</h1>

  <div class="row">
    <div class="col">
      <p>Amanda Goldstein</p>
      <address>
        900 South Crouse Avenue<br>
        Syracuse, NY 13244
      </address>
    </div>
    <div class="col">
      <p><a href="mailto:agolds12@syr.edu">Email Amanda at agolds12@syr.edu</a></p>
      <p>
        <a href="https://www.linkedin.com/in/amandasgoldstein/" target="_blank">
          <img src="../images/logo-sized.png" alt="">
          My LinkedIn Profile
        </a>
      </p>
    </div>
  </div>

  <div class="row">
    <section class="col">
      <h2>Send Me a Message</h2>
      <form action="https://formspree.io/f/mwlpkkrw" method="post">
        <p>
          <label for="fname">Your name:</label>
          <input type="text" id="fname" name="fname" autocomplete="name">
        </p>
        <p>
          <label for="email">Your email:</label>
          <input type="email" id="email" name="email" autocomplete="email">
        </p>
        <p>
          <label for="reason">What are you reaching out about?</label>
          <select name="reason" id="reason">
            <option value="internship">Internship opportunity</option>
            <option value="fulltime">Full-time opportunity</option>
            <option value="freelance">Freelance or project work</option>
            <option value="networking">Networking</option>
            <option value="other">Something else</option>
          </select>
        </p>
        <fieldset>
          <legend>How would you like me to get back to you?</legend>
          <input type="radio" id="byemail" name="contactmethod" value="email">
          <label for="byemail">Email</label><br>
          <input type="radio" id="byphone" name="contactmethod" value="phone">
          <label for="byphone">Phone</label><br>
          <input type="radio" id="bylinkedin" name="contactmethod" value="linkedin">
          <label for="bylinkedin">LinkedIn message</label>
        </fieldset>
        <p>
          <label for="comments">Your message:</label>
          <textarea id="comments" name="comments" rows="6" cols="50"></textarea>
        </p>
        <p>
          <input type="submit" value="Send Message">
        </p>
      </form>
    </section>
    <iframe class="col" title="Google map of 900 South Crouse Avenue, Syracuse, NY" src="https://maps.google.com/maps?q=900%20South%20Crouse%20Ave%20Syracuse%20NY%2013244&amp;output=embed" width="600" height="450" allowfullscreen loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
  </div>
</main>
</body>
</html>
